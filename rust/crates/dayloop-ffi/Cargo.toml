[package]
name = "dayloop-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
dayloop-domain = { path = "../dayloop-domain" }
dayloop-engine = { path = "../dayloop-engine" }

[lints.rust]
# Exporting one C ABI symbol is a documented linker-level unsafe contract. The
# domain and engine crates inherit the workspace's `unsafe_code = forbid` rule.
unsafe_code = "allow"
